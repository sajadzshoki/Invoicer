services:
  app:
    image: node:22
    container_name: invoicer-app
    working_dir: /app
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        npm install --include=dev
        npm run build
        exec npx --yes serve -s dist -l tcp://0.0.0.0:3000
    ports:
      - "3011:3000"
    environment:
      NODE_ENV: production
    volumes:
      - .:/app
      - invoicer_node_modules:/app/node_modules
    networks:
      - default
      - main
    restart: unless-stopped

volumes:
  invoicer_node_modules:
    name: invoicer_node_modules

networks:
  main:
    external: true
    name: main
